; Profile System: PHP settings.
; Errors go to the container log (`make logs`), never into the page:
; visitors get the app's error page (src/includes/error_page.php).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
; Don't advertise the PHP version in an X-Powered-By header.
expose_php = Off
