# Profile System: Apache settings for the document root.
#
# AllowOverride is None in the base image, so .htaccess files are never
# read. Everything they were meant to do lives here instead.

# Don't advertise the Apache version on error pages or in headers.
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    # No directory listings.
    Options -Indexes +FollowSymLinks
</Directory>

# Uploaded files are data: never run them as code
# (what public/uploads/.htaccess intended).
<Directory /var/www/html/uploads>
    <FilesMatch "\.(php|phtml|phar|php[0-9]*)$">
        Require all denied
    </FilesMatch>
</Directory>

# Security headers, on every response (pages, files and error pages).
#   Content-Security-Policy: scripts, styles, fonts and images only from
#     this site; no framing; forms only post here. 'unsafe-inline' and
#     'unsafe-eval' are needed by Alpine.js (its standard build evaluates
#     x-data / @click expressions) and two small inline scripts (theme,
#     profile editor settings). Moving to Alpine's CSP build would allow
#     dropping them.
#   Referrer-Policy: reset, invitation and restore links carry a secret
#     token in the URL; never send that address to another site.
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
Header always set Referrer-Policy "same-origin"
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
# HSTS: once a browser has reached the site over HTTPS (the tunnel), it
# refuses plain HTTP for a year. Only on HTTPS responses; plain-HTTP local
# development is unaffected.
Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on' || %{HTTP:X-Forwarded-Proto} == 'https'"

# Smoke-test helpers that are copied in with public/ are not for the web.
<Directory /var/www/html/docker>
    Require all denied
</Directory>

# Errors Apache produces itself (unknown URL, denied path, server error)
# get the app's error page. PHP-side errors are handled in
# src/includes/error_page.php.
ErrorDocument 400 /error.php
ErrorDocument 401 /error.php
ErrorDocument 403 /error.php
ErrorDocument 404 /error.php
ErrorDocument 405 /error.php
ErrorDocument 500 /error.php
ErrorDocument 503 /error.php
